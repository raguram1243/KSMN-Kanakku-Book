<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4338ca" />
  <meta name="robots" content="noindex" />
  <title>KSMN Kanakku-Book</title>
  <style>
    :root { --bg: #f5f6fb; --card: #ffffff; --text: #1f2333; --muted: #5b6075; --accent: #4338ca; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11131c; --card: #1b1e2b; --text: #eceef6; --muted: #a3a8bf; --accent: #a5b4fc; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; background: var(--card); border-radius: 16px;
      padding: 32px 24px; text-align: center; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.35rem; margin: 0 0 12px; }
    p { margin: 0 0 10px; line-height: 1.5; color: var(--muted); }
    .tamil { font-size: 0.95rem; }
    .back { margin-top: 18px; font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>KSMN Kanakku-Book is being upgraded</h1>
    <p>We are moving the app to a faster server. Your records are safe.</p>
    <p class="tamil">செயலி மேம்படுத்தப்படுகிறது. உங்கள் பதிவுகள் பாதுகாப்பாக உள்ளன.</p>
    <p class="back">Back by 11:30 PM tonight.</p>
  </main>
</body>
</html>
